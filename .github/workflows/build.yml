name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (config logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  build:
    name: Build x64 Windows binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/cmrs.dll dist/
          Copy-Item target/release/cmrsRun.exe dist/
          Copy-Item target/release/cmrsSetup.exe dist/
          Compress-Archive -Path dist/cmrs.dll, dist/cmrsRun.exe, dist/cmrsSetup.exe -DestinationPath dist/cmrs-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cmrs-x64
          path: dist/

  release:
    name: Attach binaries to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cmrs-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
